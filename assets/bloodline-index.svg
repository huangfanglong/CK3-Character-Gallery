<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Bloodline — Character Archive</title>

  <defs>
    <!-- Matches the Optical Archive ink seal (#1c1d24) with a restrained top-to-bottom lift. -->
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272833"/>
      <stop offset="0.55" stop-color="#1c1d24"/>
      <stop offset="1" stop-color="#15161c"/>
    </linearGradient>
    <clipPath id="sealClip">
      <rect width="512" height="512" rx="128"/>
    </clipPath>
  </defs>

  <!-- Black squircle seal: the .brand-seal in renderer/optical.css. -->
  <g clip-path="url(#sealClip)">
    <rect width="512" height="512" fill="url(#seal)"/>
    <!-- Barely-there top rim so the tile reads as a surface, not a flat cutout. -->
    <rect x="5" y="5" width="502" height="502" rx="124" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  </g>

  <!-- "B" is the real Manrope Variable glyph at wght 760 — the exact face used by
       .brand-seal in renderer/optical.css — converted to outlines so no font is needed. -->
  <path fill="#ffffff" d="
    M168 388V124H273.2Q300.9 124 318.2 135.1Q335.5 146.1 343.7 163Q351.9 179.9 351.9 197.5Q351.9 219.6 341.7 234.4Q331.6 249.3 314 254.4L314 245.2Q338.8 250.6 351.4 268.4Q364 286.2 364 308.7Q364 332.2 355.2 350.1Q346.4 367.9 328.7 377.9Q310.9 388 284.3 388Z
    M216.3 343.2H279Q289.7 343.2 298.1 338.7Q306.5 334.3 311.3 326.2Q316 318.1 316 307Q316 297.2 311.9 289.4Q307.8 281.6 299.6 277Q291.4 272.5 279.5 272.5H216.3Z
    M216.3 228H272.5Q281.4 228 288.4 224.8Q295.4 221.6 299.5 215Q303.5 208.5 303.5 198.4Q303.5 185.6 295.5 177.1Q287.4 168.5 272.5 168.5H216.3Z
  "/>

  <!-- Signature corner dot from .brand-seal::after: violet core, light ring. -->
  <circle cx="422" cy="90" r="46" fill="#f8f8fb"/>
  <circle cx="422" cy="90" r="32" fill="#8477ff"/>
</svg>
