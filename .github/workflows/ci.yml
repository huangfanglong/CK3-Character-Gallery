name: Electron CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm test
      - run: npm run test:capture-hud-runtime
      - run: npm run test:capture-ui-runtime
      - run: npm run test:capture-loop-runtime
      - run: npm run package:win:dir
      - run: npm run test:package-portrait-worker
