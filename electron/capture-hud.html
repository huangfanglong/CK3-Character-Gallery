<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; media-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CK3 capture status</title>
    <link rel="stylesheet" href="capture-hud.css" />
  </head>
  <body>
    <main class="beacon armed" id="capture-beacon" role="status" aria-live="polite" aria-atomic="true">
      <span class="beacon-mark" aria-hidden="true"></span>
      <span class="beacon-copy">
        <strong id="capture-label">READY</strong>
        <span id="capture-detail">Capture armed</span>
      </span>
      <time id="capture-time" hidden>00:00</time>
    </main>
    <script src="capture-hud.js"></script>
  </body>
</html>
