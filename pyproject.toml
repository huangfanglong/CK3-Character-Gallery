[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tkinter", "tkinter.ttk"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["data_manager", "gallery_ui", "image_cropper", "utils"]
